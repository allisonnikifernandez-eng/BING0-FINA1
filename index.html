<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bingo Rutas STEM - WIE / Secretaría de Género / Tercio EEGGCC</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Poppins', sans-serif; background-color: #f4f0f8; }
    .bingo-cell { transition: all 0.2s ease-in-out; }
    .bingo-cell:hover { transform: translateY(-2px); }
  </style>
</head>
<body class="min-h-screen pb-12 text-gray-800">

  <!-- Encabezado con Branding Oficial -->
  <header class="bg-white shadow-md border-b-4 border-pink-500 py-4 px-6 mb-6">
    <div class="max-w-4xl mx-auto flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <canvas id="logoTercio" width="50" height="50" class="rounded-full shadow-sm"></canvas>
        <canvas id="logoWIE" width="50" height="50" class="rounded-full shadow-sm"></canvas>
        <canvas id="logoGenero" width="50" height="50" class="rounded-full shadow-sm"></canvas>
      </div>

      <div class="flex items-center">
        <canvas id="logoRutasStem" width="340" height="110"></canvas>
      </div>

      <div class="flex items-center gap-2">
        <button onclick="pedirClaveAdmin()" class="bg-purple-700 hover:bg-purple-800 text-white font-semibold py-2 px-4 rounded-xl text-xs transition-colors shadow">
          🔒 Directiva
        </button>
      </div>
    </div>
  </header>

  <!-- Contenedor Principal -->
  <main class="max-w-4xl mx-auto px-4">
    <!-- Card de Registro de Usuario -->
    <div id="userCard" class="bg-white rounded-2xl shadow-lg p-6 mb-6 border border-purple-100">
      <h2 class="text-xl font-bold text-purple-900 mb-2">¡Bienvenida al Bingo RUTAS STEM! 🎉</h2>
      <p class="text-sm text-gray-600 mb-4">Ingresa tus datos antes de empezar a interactuar y marcar tus casillas.</p>
      
      <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Salón *</label>
          <select id="userSalon" class="w-full border rounded-xl p-2 text-sm focus:ring-2 focus:ring-pink-400 outline-none">
            <option value="Salón 1">Salón 1</option>
            <option value="Salón 2">Salón 2</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Tu Nombre Completo *</label>
          <input type="text" id="userName" placeholder="Ej: Maria Garcia" class="w-full border rounded-xl p-2 text-sm focus:ring-2 focus:ring-pink-400 outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Código PUCP / Correo *</label>
          <input type="text" id="userCode" placeholder="20231234 / correo@pucp.edu.pe" class="w-full border rounded-xl p-2 text-sm focus:ring-2 focus:ring-pink-400 outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Especialidad / Carrera *</label>
          <input type="text" id="userMajor" placeholder="Ej: Ing. Mecatrónica" class="w-full border rounded-xl p-2 text-sm focus:ring-2 focus:ring-pink-400 outline-none">
        </div>
      </div>
      <button onclick="guardarDatosUsuario()" class="mt-4 bg-pink-600 hover:bg-pink-700 text-white font-bold py-2.5 px-6 rounded-xl w-full text-sm transition-colors shadow-md">
        Guardar e Iniciar Bingo 🚀
      </button>
    </div>

    <!-- Tablero de Bingo -->
    <div id="bingoBoardContainer" class="hidden">
      <div class="flex items-center justify-between mb-4 bg-purple-900 text-white p-4 rounded-2xl shadow-md">
        <div>
          <p class="text-xs text-purple-200">Participante:</p>
          <p id="labelNombreParticipante" class="font-bold text-lg text-pink-300">-</p>
        </div>
        <div class="text-right">
          <p class="text-xs text-purple-200">Aciertos:</p>
          <p id="labelAciertos" class="font-bold text-2xl text-green-400">0 / 25</p>
        </div>
      </div>

      <div id="bingoGrid" class="grid grid-cols-5 gap-2 md:gap-3 bg-white p-3 md:p-5 rounded-3xl shadow-xl border-2 border-pink-200">
        <!-- Las 25 casillas se cargan dinámicamente -->
      </div>
    </div>
  </main>

  <!-- Modal para completar Reto/Casilla -->
  <div id="modalReto" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-3xl p-6 max-w-md w-full shadow-2xl border border-purple-100">
      <h3 id="modalTituloReto" class="font-bold text-lg text-purple-900 mb-2"></h3>
      <p id="modalIndicacionReto" class="text-xs text-pink-600 font-medium mb-4"></p>
      
      <div class="space-y-3 mb-5">
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Nombre de la compañera que cumple el reto *</label>
          <input type="text" id="inputNombreContacto" placeholder="Ej: Andrea Torres" class="w-full border rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-pink-400 outline-none">
        </div>
        <div>
          <label id="labelInputDetalle" class="block text-xs font-semibold text-gray-600 mb-1">Respuesta / Detalle *</label>
          <input type="text" id="inputDetalleContacto" placeholder="" class="w-full border rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-pink-400 outline-none">
        </div>
      </div>

      <div class="flex gap-2">
        <button onclick="cerrarModalReto()" class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 py-2.5 rounded-xl font-semibold text-sm transition-colors">Cancelar</button>
        <button onclick="confirmarCasilla()" class="flex-1 bg-pink-600 hover:bg-pink-700 text-white py-2.5 rounded-xl font-semibold text-sm shadow transition-colors">Validar Casilla ✨</button>
      </div>
    </div>
  </div>

  <!-- Modal Admin Directiva -->
  <div id="modalAdmin" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-3xl p-6 max-w-3xl w-full shadow-2xl max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center mb-4">
        <h3 class="font-bold text-xl text-purple-900">📊 Panel de Directiva (Registro General)</h3>
        <button onclick="cerrarModalAdmin()" class="text-gray-400 hover:text-gray-600 text-xl font-bold">&times;</button>
      </div>

      <p class="text-xs text-gray-500 mb-4">Lista de participantes guardadas en este dispositivo:</p>

      <div class="overflow-x-auto mb-4 border rounded-xl">
        <table class="w-full text-left text-xs border-collapse">
          <thead>
            <tr class="bg-purple-100 text-purple-900 border-b">
              <th class="p-2.5">Salón</th>
              <th class="p-2.5">Participante</th>
              <th class="p-2.5">Código/Correo</th>
              <th class="p-2.5">Aciertos</th>
              <th class="p-2.5">Bingo</th>
            </tr>
          </thead>
          <tbody id="tablaRegistrosAdmin">
            <!-- Registros cargados -->
          </tbody>
        </table>
      </div>

      <div class="flex justify-between items-center pt-2 border-t">
        <button onclick="descargarExcelFormateado()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 px-4 rounded-xl text-xs flex items-center gap-2 shadow transition-colors">
          📊 Descargar Excel Ordenado por Casillas (.csv)
        </button>
        <button onclick="cerrarModalAdmin()" class="bg-gray-200 text-gray-800 font-semibold py-2.5 px-4 rounded-xl text-xs">Cerrar</button>
      </div>
    </div>
  </div>

  <script>
    // URL Webhook de Google Sheets
    const GOOGLE_SHEETS_WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbx_TU_SCRIPT_ID/exec";
    const ADMIN_PASS = "WIE2026";

    let userData = { salon: 'Salón 1', name: '', code: '', major: '', points: 0, bingo: false };
    let gridData = Array(25).fill(null);
    let selectedCellIndex = null;

    const retosBingo = [
      { t: "Sabe usar Python, C++ u otro lenguaje", hint: "Ej: Programa en Python / usa C++ en laboratorios" },
      { t: "Sigue en Instagram a WIE, Sec. Género y Tercio EEGGCC", hint: "Ej: Verificado en su cuenta de IG" },
      { t: "Te contó una anécdota universitaria", hint: "Ej: Se equivocó de pabellón el primer día" },
      { t: "Coinciden en su mismo gusto musical o artista favorito", hint: "Ej: Ambas escuchan a Taylor Swift / Coldplay" },
      { t: "Recomendó un point de comida cerca a la PUCP", hint: "Ej: El huarique de hamburguesas en la Av. Universitaria" },
      { t: "Se unió a una agrupación o voluntariado este ciclo", hint: "Ej: Es voluntaria en IEEE WIE PUCP" },
      { t: "Usa IA para resumir o estudiar mejor", hint: "Ej: Usa ChatGPT para repasar conceptos clave" },
      { t: "Ha asistido a una actividad o taller previo en la PUCP", hint: "Ej: Estuvo en el taller de bienvenida" },
      { t: "Está emocionada por integrarse y hacer amigas hoy", hint: "Ej: Quiere conocer compañeras de otras carreras" },
      { t: "Sabe qué significa STEM en sus propias palabras", hint: "Ej: Ciencia, Tecnología, Ingeniería y Matemáticas" },
      { t: "Tiene un hobbie fuera de los estudios", hint: "Ej: Dibuja digitalmente / le gusta bailar" },
      { t: "Comparte tu misma facultad o especialidad", hint: "Ej: Ambas son de Ing. Biomédica" },
      { t: "LIBRE: Integración RUTAS STEM 2026", hint: "Casilla Libre de Integración ✨" },
      { t: "Tiene un atajo de teclado o hack de estudio favorito", hint: "Ej: Usa Notion + temporizador Pomodoro" },
      { t: "Usa lentes o accesorios morados/rosados hoy", hint: "Ej: Trae casaca rosada o lentes" },
      { t: "Conoce el nombre de la presidenta o representante de una agrupación", hint: "Ej: Conoce a la directiva de WIE" },
      { t: "Ha aprobado un curso difícil de EEGGCC", hint: "Ej: Aprobó Cálculo 1 o Física 1" },
      { t: "Te contó su meta académica o proyecto de este año", hint: "Ej: Quiere entrar a un grupo de investigación" },
      { t: "Tiene una bebida o snack favorito para estudiar", hint: "Ej: Toma café con leche / galletas" },
      { t: "Le apasiona un tema específico de tecnología o ciencia", hint: "Ej: La robótica médica o inteligencia artificial" },
      { t: "Ha participado en una feria de agrupaciones", hint: "Ej: Asistió a la feria en el tontódromo" },
      { t: "Sabe cuál es su lugar favorito del campus PUCP", hint: "Ej: El jardín central o la biblioteca de ciencias" },
      { t: "Te recomendó una serie, película o libro reciente", hint: "Ej: Vio una serie de ciencia ficción en Netflix" },
      { t: "Trae una cartuchera u organizador súper ordenado", hint: "Ej: Usa resaltadores de colores" },
      { t: "Tiene una frase o lema de motivación para este ciclo", hint: "Ej: 'Paso a paso todo se logra'" }
    ];

    window.onload = function() {
      renderLogos();
      cargarHistorialLocal();
    };

    function guardarDatosUsuario() {
      const salon = document.getElementById('userSalon').value;
      const name = document.getElementById('userName').value.trim();
      const code = document.getElementById('userCode').value.trim();
      const major = document.getElementById('userMajor').value.trim();

      if (!name || !code || !major) {
        alert("Por favor completa todos tus datos antes de continuar.");
        return;
      }

      userData = { salon, name, code, major, points: 0, bingo: false };
      document.getElementById('labelNombreParticipante').innerText = name + " (" + salon + ")";
      document.getElementById('userCard').classList.add('hidden');
      document.getElementById('bingoBoardContainer').classList.remove('hidden');

      renderGrid();
      enviarAGoogleSheets();
    }

    function renderGrid() {
      const grid = document.getElementById('bingoGrid');
      grid.innerHTML = '';

      retosBingo.forEach((reto, idx) => {
        const isFree = idx === 12;
        if (isFree && !gridData[idx]) {
          gridData[idx] = { nombre: "RUTAS STEM", detalle: "Casilla Libre" };
        }

        const celda = gridData[idx];
        const isCompleted = !!celda;

        const btn = document.createElement('button');
        btn.onclick = () => abrirModalReto(idx);
        btn.className = `bingo-cell aspect-square p-2 text-[10px] md:text-xs font-semibold rounded-2xl flex flex-col justify-between items-center text-center shadow border transition-all ${
          isCompleted 
            ? 'bg-pink-500 text-white border-pink-600 shadow-md scale-[0.98]' 
            : 'bg-white hover:bg-pink-50 text-purple-950 border-purple-100'
        }`;

        btn.innerHTML = `
          <span class="leading-tight ${isCompleted ? 'text-white' : 'text-gray-800'}">${reto.t}</span>
          ${isCompleted 
            ? `<div class="bg-white/20 w-full py-1 rounded-lg mt-1 text-[9px] font-bold truncate">✓ ${celda.nombre}</div>` 
            : `<span class="text-[9px] text-pink-500 font-bold mt-1">Marcar +</span>`}
        `;

        grid.appendChild(btn);
      });

      actualizarAciertos();
    }

    function abrirModalReto(index) {
      if (index === 12) return;
      selectedCellIndex = index;
      const reto = retosBingo[index];

      document.getElementById('modalTituloReto').innerText = "Reto #" + (index + 1) + ": " + reto.t;
      document.getElementById('modalIndicacionReto').innerText = "Sugerencia: " + reto.hint;
      document.getElementById('labelInputDetalle').innerText = "Respuesta / Detalle relevante *";
      document.getElementById('inputDetalleContacto').placeholder = reto.hint;

      const celdaActual = gridData[index];
      document.getElementById('inputNombreContacto').value = celdaActual ? celdaActual.nombre : '';
      document.getElementById('inputDetalleContacto').value = celdaActual ? celdaActual.detalle : '';

      document.getElementById('modalReto').classList.remove('hidden');
    }

    function cerrarModalReto() {
      document.getElementById('modalReto').classList.add('hidden');
    }

    function confirmarCasilla() {
      const nombre = document.getElementById('inputNombreContacto').value.trim();
      const detalle = document.getElementById('inputDetalleContacto').value.trim();

      if (!nombre || !detalle) {
        alert("Por favor completa el nombre de la compañera y la respuesta.");
        return;
      }

      gridData[selectedCellIndex] = { nombre, detalle };
      cerrarModalReto();
      renderGrid();
      verificarBingo();
      enviarAGoogleSheets();
    }

    function actualizarAciertos() {
      const aciertos = gridData.filter(x => x !== null).length;
      userData.points = aciertos;
      document.getElementById('labelAciertos').innerText = aciertos + " / 25";
    }

    function verificarBingo() {
      let tieneBingo = false;
      const b = gridData.map(x => x !== null);

      for (let i = 0; i < 5; i++) {
        if (b[i*5] && b[i*5+1] && b[i*5+2] && b[i*5+3] && b[i*5+4]) tieneBingo = true;
        if (b[i] && b[i+5] && b[i+10] && b[i+15] && b[i+20]) tieneBingo = true;
      }
      if (b[0] && b[6] && b[12] && b[18] && b[24]) tieneBingo = true;
      if (b[4] && b[8] && b[12] && b[16] && b[20]) tieneBingo = true;

      if (tieneBingo && !userData.bingo) {
        userData.bingo = true;
        confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 } });
        alert("¡FELICIDADES! 🎉 ¡HAS HECHO BINGO EN RUTAS STEM!");
      }
    }

    // ENVÍO A GOOGLE SHEETS
    function enviarAGoogleSheets() {
      if (!userData.name) return;

      const payload = {
        salon: userData.salon,
        participante: userData.name,
        codigo: userData.code,
        especialidad: userData.major,
        aciertos: userData.points,
        bingo: userData.bingo ? "SÍ" : "NO",
        fechaHora: new Date().toLocaleTimeString('es-PE'),
        casillas: gridData.map(c => c ? `${c.nombre}: ${c.detalle}` : '')
      };

      guardarLocal(payload);

      if (GOOGLE_SHEETS_WEBHOOK_URL && !GOOGLE_SHEETS_WEBHOOK_URL.includes("TU_SCRIPT_ID")) {
        fetch(GOOGLE_SHEETS_WEBHOOK_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        }).catch(err => console.log("Error envío nube:", err));
      }
    }

    function guardarLocal(payload) {
      let registros = JSON.parse(localStorage.getItem('bingo_registros') || '[]');
      const idx = registros.findIndex(r => r.codigo === payload.codigo);
      if (idx >= 0) {
        registros[idx] = payload;
      } else {
        registros.push(payload);
      }
      localStorage.setItem('bingo_registros', JSON.stringify(registros));
    }

    function pedirClaveAdmin() {
      const pass = prompt("Ingrese la clave de directiva:");
      if (pass === ADMIN_PASS) {
        cargarTablaAdmin();
        document.getElementById('modalAdmin').classList.remove('hidden');
      } else if (pass !== null) {
        alert("Clave incorrecta.");
      }
    }

    function cerrarModalAdmin() {
      document.getElementById('modalAdmin').classList.add('hidden');
    }

    function cargarTablaAdmin() {
      const registros = JSON.parse(localStorage.getItem('bingo_registros') || '[]');
      const tbody = document.getElementById('tablaRegistrosAdmin');
      tbody.innerHTML = '';

      if (registros.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-gray-400">No hay registros aún.</td></tr>`;
        return;
      }

      registros.forEach(r => {
        const tr = document.createElement('tr');
        tr.className = "border-b hover:bg-gray-50";
        tr.innerHTML = `
          <td class="p-2.5 font-bold text-purple-900">${r.salon}</td>
          <td class="p-2.5 font-medium">${r.participante}</td>
          <td class="p-2.5 text-gray-500">${r.codigo}</td>
          <td class="p-2.5 font-bold text-pink-600">${r.aciertos} / 25</td>
          <td class="p-2.5">${r.bingo === 'SÍ' ? '🎉 SÍ' : 'NO'}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    // DESCARGA EXCEL LOCAL EN ORDEN CON ';' SEPARANDO EN COLUMNAS INDIVIDUALES
    function descargarExcelFormateado() {
      const registros = JSON.parse(localStorage.getItem('bingo_registros') || '[]');
      if (registros.length === 0) {
        alert("Aún no hay participantes registrados.");
        return;
      }

      let csvContent = "\uFEFFSalon;Participante;Codigo_Correo;Especialidad;Aciertos;Bingo;Hora";
      for (let i = 1; i <= 25; i++) {
        csvContent += `;Casilla_${i}`;
      }
      csvContent += "\n";

      registros.forEach(r => {
        csvContent += `"${r.salon}";"${r.participante}";"${r.codigo}";"${r.especialidad}";"${r.aciertos}";"${r.bingo}";"${r.fechaHora}"`;
        if (r.casillas && Array.isArray(r.casillas)) {
          r.casillas.forEach(c => {
            csvContent += `;"${c ? c.replace(/"/g, '""') : ''}"`;
          });
        } else {
          for (let i = 0; i < 25; i++) csvContent += `;"";`;
        }
        csvContent += "\n";
      });

      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `Reporte_Bingo_RUTAS_STEM_${new Date().toISOString().slice(0,10)}.csv`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    function cargarHistorialLocal() {
      const registros = JSON.parse(localStorage.getItem('bingo_registros') || '[]');
      if (registros.length > 0) console.log("Registros activos localmente:", registros.length);
    }

    // Render de Logos
    function renderLogos() {
      const c1 = document.getElementById('logoTercio').getContext('2d');
      c1.fillStyle = '#6B21A8'; c1.beginPath(); c1.arc(25,25,25,0,Math.PI*2); c1.fill();
      c1.fillStyle = '#FFFFFF'; c1.font = 'bold 10px Poppins'; c1.textAlign = 'center';
      c1.fillText('TERCIO', 25, 22); c1.fillText('EEGGCC', 25, 33);

      const c2 = document.getElementById('logoWIE').getContext('2d');
      c2.fillStyle = '#7E22CE'; c2.beginPath(); c2.arc(25,25,25,0,Math.PI*2); c2.fill();
      c2.fillStyle = '#FFFFFF'; c2.font = 'bold 12px Poppins'; c2.textAlign = 'center';
      c2.fillText('IEEE', 25, 20); c2.fillStyle = '#F472B6'; c2.fillText('WIE', 25, 34);

      const c3 = document.getElementById('logoGenero').getContext('2d');
      c3.fillStyle = '#DB2777'; c3.beginPath(); c3.arc(25,25,25,0,Math.PI*2); c3.fill();
      c3.fillStyle = '#FFFFFF'; c3.font = 'bold 9px Poppins'; c3.textAlign = 'center';
      c3.fillText('SEC.', 25, 20); c3.fillText('GÉNERO', 25, 32);

      // Logo Rutas STEM
      const cR = document.getElementById('logoRutasStem').getContext('2d');
      
      // Fondo rosa ovalado
      cR.fillStyle = '#E8C5D8'; 
      cR.beginPath(); 
      cR.ellipse(170, 42, 155, 36, -0.05, 0, Math.PI * 2); 
      cR.fill();

      // Texto RUTAS
      cR.fillStyle = '#9C2A6A'; 
      cR.font = 'bold 110px Poppins'; 
      cR.textAlign = 'left';
      cR.fillText('RUTAS', 10, 62);

      // Texto STEM
      cR.fillStyle = '#FFFFFF'; 
      cR.strokeStyle = '#1B5E20';
      cR.lineWidth = 14;
      cR.font = 'bold 110px Poppins';
      cR.strokeText('STEM', 95, 92);
      cR.fillText('STEM', 95, 92);

      // Recuadro verde claro (Slogan)
      cR.fillStyle = '#CAE8B6'; 
      cR.beginPath(); 
      cR.roundRect(35, 78, 285, 26, 4); 
      cR.fill();

      // Texto Slogan (Dentro del cuadro verde)
      cR.fillStyle = '#1B5E20'; 
      cR.font = '600 21px Poppins'; 
      cR.textAlign = 'center';
      cR.fillText('Explorar también es parte de formarse', 177, 98);
    }
  </script>
</body>
</html>
